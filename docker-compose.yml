version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: malaria
      POSTGRES_USER: malaria
      POSTGRES_PASSWORD: malaria
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U malaria"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - POSTGRES_DB=malaria
      - POSTGRES_USER=malaria
      - POSTGRES_PASSWORD=malaria
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - ML_SERVICE_URL=http://ml_service:8001
      - DJANGO_SECRET_KEY=dev-secret-change-me
      - DJANGO_DEBUG=1
    depends_on:
      db:
        condition: service_healthy

  ml_service:
    build: ./ml_service
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./ml_service:/app
    ports:
      - "8001:8001"

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
      - VITE_ML_BASE_URL=http://localhost:8001

volumes:
  db_data:
